          style: italic
        - asset: lib/assets/fonts/Archivo/Archivo-ExtraBold.otf
          weight: 800
          style: normal
        - asset: lib/assets/fonts/Archivo/Archivo-ExtraBoldItalic.otf
          weight: 800
          style: italic
        - asset: lib/assets/fonts/Archivo/Archivo-ExtraLight.otf
          weight: 200
          style: normal
        - asset: lib/assets/fonts/Archivo/Archivo-ExtraLightItalic.otf
          weight: 200
          style: italic
        - asset: lib/assets/fonts/Archivo/Archivo-Italic.otf
          weight: 400
          style: italic
        - asset: lib/assets/fonts/Archivo/Archivo-Light.otf
          weight: 300
          style: normal
        - asset: lib/assets/fonts/Archivo/Archivo-LightItalic.otf
