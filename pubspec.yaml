name: tennaxia_geolocation
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_svg: ^2.0.17
  flutter_verification_code: ^1.1.7
  freezed_annotation: ^2.4.4
  geolocator: ^13.0.2
  go_router: ^14.7.1
  hooks_riverpod: ^2.5.2
  intl: ^0.19.0
  latlong2: ^0.9.1
  loading_animation_widget: ^1.3.0
  mailer: ^6.4.1
  mapbox_maps_flutter: ^2.5.1
  phosphor_flutter: ^2.1.0
  riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  signature: ^5.5.0
  supabase_flutter: ^2.0.0

dev_dependencies:
  build_runner: ^2.4.12
  build_verify: ^3.1.0
  build_version: ^2.1.1
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - lib/assets/img/
  fonts:
    - family: Archivo
      fonts:
        - asset: lib/assets/fonts/Archivo/Archivo-Black.otf
          weight: 900
          style: normal
        - asset: lib/assets/fonts/Archivo/Archivo-BlackItalic.otf
          weight: 900
          style: italic
        - asset: lib/assets/fonts/Archivo/Archivo-Bold.otf
          weight: 700
          style: normal
